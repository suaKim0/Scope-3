<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scope3</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <header id="header">Scope:3</header>

    <div id="sub_head">
        <p style="color: #0144EEC7;">좋은 오후에요!</p>
        <p>오늘도<br>절약 중이신가요?</p>
    </div>

    <div id="block_1"> <!--절약 상태-->
        <div id="all_status">
            <div id="stat_left"> <!-- 추가 -->
                <div id="stat_text">
                    <p id="stat_label">오늘은</p>
                    <p id="stat_main"></p>
                </div>
                <div id="stat_sav">총 49g</div> <!-- stat_total → stat_sav로 이동 -->
            </div>
            <div id="char_emo"></div>
        </div>
    </div>

    <div id="block_2"> <!--실시간 전력량, 탄소배출량-->
        <div class="now_stat" id="now_elec"> <!--실시간 전력-->
            <p class="stat_title">실시간 전력</p>
            <div class="graph">
                <svg class="gauge_svg" viewBox="0 0 200 110">
                    <path class="gauge_bg" d="M 20 100 A 80 80 0 0 1 180 100"></path>
                    <path id="now_elec_arc" class="gauge_fg gauge_fg--blue" d="M 20 100 A 80 80 0 0 1 180 100"></path>
                </svg>
                <p id="now_elec_w" class="gauge_value gauge_value--blue"></p>
            </div>
            <div></div>
        </div>

        <div class="now_stat" id="now_co2"> <!--실시간 탄소배출량-->
            <span class="stat_title">탄소 배출량</span>
            <div class="graph">
                <svg class="gauge_svg" viewBox="0 0 200 110">
                    <path class="gauge_bg gauge_bg--blue" d="M 20 100 A 80 80 0 0 1 180 100"></path>
                    <path id="now_co2_arc" class="gauge_fg gauge_fg--red" d="M 20 100 A 80 80 0 0 1 180 100"></path>
                </svg>
                <span id="now_co2_gph" class="gauge_value gauge_value--red"></span>
            </div>
            <span></span>
        </div>
    </div>


    <div id="block_3"> <!--오늘의 절약 일지-->
        <div id="today_log">
            <span class="stat_title">오늘의 절약 일지</span>
            <div id="log_list"></div>
        </div>
    </div>

    <script src="./index.js"></script>
</body>

</html>
